name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -e
          xcodebuild \
            -project CuotiScanner.xcodeproj \
            -scheme CuotiScanner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/CuotiScanner.app"
          ls -la "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # ad-hoc 签名（TrollStore 安装更稳；失败也不影响后续打包）
          brew install ldid || true
          ldid -S Payload/CuotiScanner.app/CuotiScanner || true
          zip -qry CuotiScanner.ipa Payload
          ls -lh CuotiScanner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CuotiScanner-ipa
          path: CuotiScanner.ipa
          if-no-files-found: error
