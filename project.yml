name: CuotiScanner
options:
  bundleIdPrefix: com.kuake.tools
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  CuotiScanner:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kuake.tools.cuotiscanner
        PRODUCT_NAME: CuotiScanner
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "12"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"

schemes:
  CuotiScanner:
    build:
      targets:
        CuotiScanner: all
    run:
      config: Release
    archive:
      config: Release
